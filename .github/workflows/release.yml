name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # npm@latest (12+) requires Node >= 22.
          # Deliberately NO registry-url: it writes an authToken line into
          # .npmrc that prevents npm from attempting the trusted-publishing
          # OIDC exchange (npm defaults to registry.npmjs.org anyway).
          node-version: 22
          cache: npm

      - name: Update npm
        # Trusted publishing requires npm >= 11.5.1
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build library
        run: npm run build-lib

      - name: Publish
        # Auth via npm trusted publishing (OIDC) — no token needed.
        # Prereleases publish under the "next" dist-tag so a plain
        # `npm install` never resolves to them.
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
            *) PRERELEASE_FLAG="" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $PRERELEASE_FLAG
